apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      scrape_timeout: 5s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: worker-pool
        scrape_interval: 1s
        metrics_path: /metrics/prometheus
        static_configs:
          - targets:
              - worker-pool-service.apps.svc.cluster.local:8080