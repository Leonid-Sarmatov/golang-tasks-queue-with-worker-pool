apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
  - protocol: TCP
    port: 3000        # Service port inside the cluster
    targetPort: 3000  # The containter port
    nodePort: 30082   # External access port on nodes
  type: NodePort      # Service type for the external access
