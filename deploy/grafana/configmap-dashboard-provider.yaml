apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1

    providers:
      - name: worker-pool
        orgId: 1
        folder: Worker Pool
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 5
        options:
          path: /etc/grafana/dashboards